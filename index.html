<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="CoachRoster: clickable prototype of the coach company workload app (INF2001 P14-3).">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232166eb'/%3E%3Crect x='9' y='7' width='14' height='14' rx='3' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M9 14h14M12 24v-3M20 24v-3' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<title>CoachRoster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: matches the team's Figma wireframes. Full-width top bar, white left menu, grey page, white cards.
   Light only on purpose, because the Figma design has no dark version. */
:root{
  color-scheme:light;
  --bg:#f4f5f6; --surface:#ffffff; --surface-2:#f4f5f6; --ink:#171a21; --ink-2:#474d57; --muted:#6b7380; --faint:#9ea6b2; --line:#ccd1d9;
  --navy:#2166eb; --navy-ink:#ffffff; --navy-soft:#e8f0ff;
  --amber:#b26b05; --amber-soft:#fff5d9; --amber-ink:#b26b05;
  --ok:#1a8c54; --ok-soft:#e5f7ed; --warn:#b26b05; --warn-soft:#fff5d9; --bad:#db2e2e; --bad-soft:#ffebeb; --info:#2166eb; --info-soft:#e8f0ff;
  --tag:#7340d9; --tag-soft:#f0e8ff;
  --board:#171a21; --board-ink:#ffffff;
  --scrim:rgb(23 26 33 / .45);
  --shadow:0 1px 2px rgb(23 26 33 / .05), 0 6px 20px rgb(23 26 33 / .08);
  --f-display:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.stack{display:grid;gap:12px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.link{background:none;border:0;padding:0;color:var(--info);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--bad)}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:600 11px/18px var(--f-body);text-align:center}

/* forms */
.field{display:grid;gap:6px}
.field>span{font-weight:600;font-size:14px}
.field.sm>span{font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=date],input:not([type]),select,textarea{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.field.sm select{min-height:36px;padding:4px 8px;font-size:14px}
textarea{resize:vertical;min-height:84px}
input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.err{color:var(--bad);font-size:13px;font-weight:500}
.err:empty,.err-banner:empty{display:none}
.err-banner{padding:10px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-weight:500;font-size:14px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
legend{font-weight:600;font-size:14px;margin-bottom:6px;padding:0}
.checks{display:grid;gap:6px}
.checks.wrap{display:flex;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--navy);margin:0}
.check:has(input:checked){border-color:var(--navy);background:var(--navy-soft)}
.pw{position:relative}
.pw input{padding-right:64px}
.pw .link{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px}
.form{display:grid;gap:18px}
.rules{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:13px}
.rules li::before{content:"○ ";color:var(--muted)}
.rules li.ok{color:var(--ok)} .rules li.ok::before{content:"● ";color:var(--ok)}

/* pills, banners */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.bnr{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.bnr>div{flex:1 1 260px;min-width:0}
.bnr.ok{background:var(--ok-soft);border-color:transparent}
.bnr.warn{background:var(--warn-soft);border-color:transparent}
.bnr.bad{background:var(--bad-soft);border-color:transparent}
.bnr.bad b{color:var(--bad)}
.bnr.info{background:var(--info-soft);border-color:transparent}
.bnr ul{margin:6px 0 0;padding-left:18px}
.code{display:inline-block;font:600 12px/1 var(--f-body);padding:5px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.route{font-weight:600}
.route i{font-style:normal;color:var(--muted);padding:0 4px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.cardh{font-size:18px;margin-bottom:12px}
.empty{color:var(--muted);text-align:center;padding:28px}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
.dl dt{color:var(--muted);font-size:14px}
.dl dd{margin:0;font-weight:500;min-width:0}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.rt{width:100%;border-collapse:collapse;font-size:14px}
.rt th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.rt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.rt tr:last-child td{border-bottom:0}
.rt tr.dim td{color:var(--muted)}
.rt tr.dim td b{font-weight:500}
.why{font-size:13px;color:var(--muted)}

/* auth */
.auth{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font:700 18px/1 var(--f-display);color:var(--ink)}
.brand-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--navy);color:var(--navy-ink)}
.auth-card{width:min(440px,100%);display:grid;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px}
.auth-card h1{font-size:24px}
.testbox{border:1.5px dashed var(--amber);border-radius:12px;padding:14px;background:var(--amber-soft);display:grid;gap:10px;font-size:13px}
.testbox .tag,.tag{display:inline-block;font:600 11px/1 var(--f-body);padding:4px 8px;border-radius:999px;border:1px dashed var(--amber);background:var(--amber-soft);color:var(--amber)}
.acct{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed color-mix(in srgb,var(--amber) 50%,transparent)}
.acct:first-of-type{border-top:0}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100%}
.top{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;min-height:56px;padding-block:8px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.top .brand{margin-right:auto}
.clock{font-size:12px;color:var(--muted)}
.alerts{position:relative;border:0;border-radius:999px;padding:4px 10px;background:var(--navy-soft);color:var(--navy);font:500 12px/1.4 var(--f-body);cursor:pointer}
.alerts.none{background:var(--surface-2);color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:4px;border-radius:8px;cursor:pointer;text-align:left}
.who:hover{background:var(--surface-2)}
.who b{display:block;font-size:12px;font-weight:600}
.who small{display:block;font-size:11px;color:var(--muted)}
.avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--ink-2);font:600 11px/1 var(--f-body)}
.side{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px - env(safe-area-inset-top,0px));background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:14px 8px;padding-left:max(8px,env(safe-area-inset-left,0px))}
.side-nav{display:grid;gap:2px}
.nav{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;font-size:14px}
.nav .ic{color:var(--muted);width:18px;height:18px}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--navy-soft);color:var(--navy)}
.nav.on .ic{color:var(--navy)}
.nav .nb{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font:600 11px/20px var(--f-body);text-align:center}
.side-foot{margin-top:auto;padding:10px;font-size:14px}
.main{min-width:0;display:flex;flex-direction:column}
.page{padding-block:22px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:18px;max-width:1280px;width:100%;align-content:start}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ph h1{font-size:24px}
.ph p{max-width:70ch;font-size:13px;margin-top:4px}
.bnav{display:none}

/* popovers */
.pop{position:absolute;top:58px;right:max(16px,env(safe-area-inset-right,0px));width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:40;overflow:hidden}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.pop-h h3{font-size:18px}
.nlist{max-height:60vh;overflow:auto}
.nitem{display:grid;gap:2px;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer}
.nitem:hover{background:var(--surface-2)}
.nitem.unread{background:var(--info-soft)}
.nitem .t{font-size:14px}
.nitem .w{font-size:12px;color:var(--muted)}
.prof{padding:14px;display:grid;gap:10px}

/* modal */
.mback{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal>form{display:flex;flex-direction:column;min-height:0}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px 8px}
.mh h2{font-size:22px}
.modal.bad .mh h2{color:var(--bad)}
.modal.ok .mh h2{color:var(--ok)}
.mb{padding:8px 18px 16px;display:grid;gap:14px}
.mf{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:12px 18px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--navy)}
.hint{padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:14px}
.hint.ok{background:var(--ok-soft)} .hint.bad{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{font:500 13px/1 var(--f-mono);padding:7px 9px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chipbtn.busy{opacity:.5;text-decoration:line-through}

/* toast */
#toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;display:grid;gap:8px;width:min(460px,calc(100vw - 32px));pointer-events:none}
.toast{padding:12px 14px;border-radius:10px;background:var(--board);color:var(--board-ink);box-shadow:var(--shadow);font-size:14px;border-left:4px solid var(--ok);animation:tin .2s ease-out}
.toast.bad{border-left-color:var(--bad)} .toast.info{border-left-color:var(--navy)}
.toast.out{opacity:0;transition:opacity .3s}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* test tools */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;border:1.5px dashed var(--amber);background:var(--amber-soft);color:var(--amber-ink);font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.fab .badge{position:static;margin-left:2px}
.dback{position:fixed;inset:0;background:var(--scrim);z-index:58}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:60;background:var(--surface);border-left:2px dashed var(--amber);overflow:auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:18px;padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start}
.drawer h3{font-size:18px}
.dsec{display:grid;gap:8px}
.mail{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mail>button{display:grid;gap:2px;width:100%;text-align:left;padding:10px 12px;border:0;background:var(--surface);cursor:pointer}
.mail.new>button{background:var(--info-soft)}
.mail-b{padding:10px 12px;border-top:1px solid var(--line);font-size:14px;display:grid;gap:10px;background:var(--surface-2)}
.switch{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.switch input{width:20px;height:20px;accent-color:var(--amber);flex:none}
.try{margin:0;padding-left:18px;font-size:14px;display:grid;gap:4px}
.scg{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.scg summary{padding:10px 12px;font-weight:600;cursor:pointer}
.scl{display:grid;padding:0 6px 6px}
.scn-item{display:grid;grid-template-columns:28px 1fr;gap:6px;text-align:left;padding:7px 6px;border:0;border-radius:6px;background:transparent;cursor:pointer;font-size:13px}
.scn-item:hover{background:var(--surface-2)}
.scn-item.on{background:var(--amber-soft);color:var(--amber);font-weight:600}
.scn-item .mono{color:var(--muted)}
.scnbar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;align-items:center;gap:6px;width:min(640px,calc(100vw - 220px));padding:8px;border-radius:12px;background:var(--surface);border:1.5px dashed var(--amber);box-shadow:var(--shadow)}
.scnbar .txt{display:grid;gap:2px;flex:1;min-width:0}
.scnbar b{font-size:14px}
.scnbar .e{font-size:12px;color:var(--muted)}
.scnbar .iconbtn{font-size:22px;flex:none}
.scnbar .iconbtn:disabled{opacity:.3}
.try-h{font-weight:600;font-size:13px;margin-top:6px}

/* staff */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tile{display:grid;gap:4px;align-content:start}
.tile .big{font:700 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tile.alert{background:var(--bad-soft);border-color:var(--bad)}
.tile.alert .eyebrow,.tile.alert .big{color:var(--bad)}
.tile .big small{font-size:18px;color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--navy)}
.jobrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.jobrow:hover{border-color:var(--navy)}
.datebox{display:grid;place-items:center;border-radius:8px;background:var(--surface-2);padding:6px 0;line-height:1.1}
.datebox b{font:700 22px/1 var(--f-display)}
.datebox span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.wtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.wtab{flex:none;display:grid;gap:2px;text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:132px}
.wtab b{font-size:14px}
.wtab span{font-size:12px;color:var(--muted)}
.wtab.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:var(--navy-soft)}
.wtab.st-closed-missed span{color:var(--bad)}
.wtab.st-submitted span,.wtab.st-closed-sub span{color:var(--ok)}
.wtab.st-open span{color:var(--warn)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.day{display:grid;gap:10px;align-content:start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.day.has{border-color:color-mix(in srgb,var(--navy) 45%,var(--line))}
.day.bad{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.day-h{display:flex;align-items:baseline;gap:8px}
.dow{font:700 20px/1 var(--f-display)}
.dnum{color:var(--muted);font-size:13px}
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;align-items:center}

.slot .x{border:0;background:transparent;cursor:pointer;width:22px;height:22px;border-radius:4px;color:var(--muted);font-size:16px;line-height:1}
.slot .x:hover{background:var(--bad-soft);color:var(--bad)}
.actionbar{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.tk{display:grid;gap:8px}
.tk-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.quote{padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:14px}

.wk{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--surface)}
.wk.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.wk.off{color:var(--muted);border-style:dashed}
.alloc,.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.jlist{padding:10px;display:grid;gap:6px}
.jlist .cardh{padding:6px 6px 0}
.jl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer}
.jl:hover{background:var(--surface-2)}
.jl.on{background:var(--navy-soft);border-color:var(--navy)}
.jl-m{display:grid;font-size:13px;min-width:0}
.jl-m b{font-size:14px}
.jl-s{grid-column:2;display:flex;gap:4px;flex-wrap:wrap}
.dot{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px}

.jobhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}

.slotc{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.slotc.act{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.slotc-h{display:flex;justify-content:space-between;align-items:center}
.slotc-n{font:600 20px/1.2 var(--f-display)}
.chip-s{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);vertical-align:1px}
.rt tr.over td{background:var(--bad-soft)}
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cmp{display:grid;gap:10px;align-content:start;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}

.st{display:grid;gap:3px;justify-items:start}

function user(id){return S.users.find(u=>u.id===id)}
function me(){return S.session&&user(S.session.uid)}

function NOW(){if(role()==='manager')return{date:'2026-11-05',time:'09:00'};return S.test.afterDeadline?{date:'2026-11-05',time:'00:01'}:{date:'2026-11-04',time:'14:00'}}
function stamp(){const n=NOW();return `${fmtD(n.date)} ${n.time}`}
function getAvail(uid,mon){const a=S.avail[uid]||(S.avail[uid]={});return a[mon]||(a[mon]={submitted:false,submittedAt:null,dirty:false,days:{}})}
function routeOf(o,d){if(!o||!d||o===d)return null;if(o==='SG'&&ROUTES[d])return d;if(d==='SG'&&ROUTES[o])return o;return null}
function timing(j){const r=routeOf(j.o,j.d);const drive=ROUTES[r].drive;const breaks=Math.floor((drive-1)/120);const total=drive+breaks*30;const s=toMin(j.dep);return{drive,breaks,total,start:s,end:s+total,arr:fromMin(s+total)}}
function allJobs(){return[...S.pubJobs,...S.jobs]}
function findJob(id){return allJobs().find(j=>j.id===id)}
function sortJobs(a){return[...a].sort((x,y)=>(x.date+x.dep).localeCompare(y.date+y.dep))}
function deadlineOf(mon){return addDays(mon,-12)}
function weekState(uid,mon){const n=NOW(),a=getAvail(uid,mon);if(dayDiff(n.date,mon)>35)return'locked';if(n.date>deadlineOf(mon))return a.submitted?'closed-sub':'closed-missed';return a.submitted?'submitted':'open'}
function assignedMins(uid){return S.jobs.filter(j=>j.captain===uid||j.crew===uid).reduce((t,j)=>t+timing(j).total,0)}
function workload(u){return u.lastWeek*60+assignedMins(u.id)}
function eligibility(u,job,slot){
  if(u.status!=='active')return{ok:false,code:'inactive',short:'Account inactive',why:'Account inactive'};
  const a=getAvail(u.id,ALLOC_WEEK);
  if(!a.submitted)return{ok:false,code:'missed',short:'Missed deadline',why:'Missed the Wed deadline'};
  if(job[slot]===u.id)return{ok:true,assigned:true};
  const other=slot==='captain'?'crew':'captain';
  if(job[other]===u.id)return{ok:false,code:'same',short:'Already on this job',why:`Already the ${other} on this job`};
  const d=a.days[job.date];const t=timing(job);
  const cover=d&&d.slots.find(x=>toMin(x.s)<=t.start&&toMin(x.e)>=t.end);
  if(!cover)return d&&d.slots.length?{ok:false,code:'unavail',short:'Not free at this time',why:`Only free ${d.slots.map(x=>x.s+'–'+x.e).join(', ')}`}:{ok:false,code:'unavail',short:'Not available this day',why:'Not available this day'};
  for(const j of S.jobs){
    if(j.id===job.id||j.date!==job.date||(j.captain!==u.id&&j.crew!==u.id))continue;
    const t2=timing(j);
    if(t.start<t2.end&&t2.start<t.end)return{ok:false,code:'clash',short:`Already on ${j.id}`,why:`Already on ${j.id} (${j.dep}–${t2.arr})`};
    const gap=t.start>=t2.end?t.start-t2.end:t2.start-t.end;
    if(gap<30)return{ok:false,code:'rest',short:'Needs a 30-min break',why:`Needs a 30-min break after ${j.id} (2-hour driving rule)`};
  }
  return{ok:true,warn:d.loc&&d.loc!==job.o?`Starts the day in ${SHORT[d.loc]}`:''};
}

function coachBusy(reg,job){const t=timing(job);return S.jobs.find(j=>j.id!==job.id&&j.coach===reg&&j.date===job.date&&timing(j).start<t.end&&t.start<timing(j).end)}

  ${excl.length?`<p class="muted small">Not shown: ${excl.map(x=>`${esc(x.u.name)} (${x.el.code==='missed'?'missed the Wed deadline':'account inactive'})`).join(', ')}.</p>`:''}</section>

  status:m=>{const u=user(m.uid),off=u.status!=='inactive';return{title:off?`Deactivate ${esc(u.name)}?`:`Activate ${esc(u.name)}?`,tone:off?'bad':'',body:`<p>${off?`${esc(u.name)} won't be able to sign in. Their past records stay. ${u.role==='staff'?'They won\'t appear in allocation.':''}`:`${esc(u.name)} will be able to sign in again.`}</p>`,foot:`<button class="btn" data-act="closeModal">Cancel</button><button class="btn ${off?'danger solid':'primary'}" data-act="statusDo" data-uid="${u.id}">${off?'Deactivate':'Activate'}</button>`}},
  confirmMaint:m=>{const n=S.users.filter(u=>u.status==='active').length;return{title:'Schedule maintenance?',body:`<dl class="dl"><dt>Date</dt><dd>${fmtD(m.date)} 2026</dd><dt>Time</dt><dd class="mono">02:00–04:00 SGT</dd></dl><p>All <b>${n} active users</b> will get this email:</p><div class="quote">${esc(m.msg)}</div>`,foot:`<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="doMaint">Schedule and email</button>`}},
};
function renderModal(){
  const root=$('#modal-root'),m=S.modal;
  if(!m){root.innerHTML='';return}
  const r=MODALS[m.type](m);
  const inner=`<div class="mh"><h2 id="mt">${r.title}</h2><button type="button" class="iconbtn" data-act="closeModal" aria-label="Close">${icon('x')}</button></div><div class="mb">${r.body}</div>${r.foot?`<div class="mf">${r.foot}</div>`:''}`;
  root.innerHTML=`<div class="mback" data-act="backdrop"><div class="modal ${r.tone||''}" role="dialog" aria-modal="true" aria-labelledby="mt">${r.form?`<form data-form="${r.form}" novalidate>${inner}</form>`:inner}</div></div>`;
  const f=root.querySelector('.mb input:not([type=hidden]),.mb select,.mb textarea');(f||root.querySelector('.mf .btn.primary')||root.querySelector('.iconbtn')).focus();
}

function renderTest(){
  const root=$('#test-root'),unread=S.inbox.filter(m=>!m.seen).length;
  const fab=`<button class="fab ${S.session?'raised':''}" data-act="drawer" aria-label="Test tools">${icon('flask')}<span>Test tools</span>${unread?`<b class="badge">${unread}</b>`:''}</button>`;
  const sc=S.ui.scn!=null&&SCN[S.ui.scn];
  const bar=sc?`<div class="scnbar" role="region" aria-label="Presenter"><button class="iconbtn" data-act="scnStep" data-d="-1" aria-label="Previous scenario" ${S.ui.scn===0?'disabled':''}>‹</button><div class="txt"><span class="small"><span class="tag">${S.ui.scn+1} / ${SCN.length} · ${sc.g}</span></span><b>${sc.t}</b><span class="e">${sc.e}</span></div><button class="iconbtn" data-act="scnStep" data-d="1" aria-label="Next scenario" ${S.ui.scn===SCN.length-1?'disabled':''}>›</button><button class="iconbtn" data-act="scnStop" aria-label="Stop presenting">${icon('x','sm')}</button></div>`:'';
  if(!S.ui.drawer){root.innerHTML=fab+bar;return}
  const sw=(k,l,d)=>`<label class="switch"><span><b>${l}</b><br><span class="muted small">${d}</span></span><input type="checkbox" data-change="testToggle" data-k="${k}" ${S.test[k]?'checked':''}></label>`;
  const mails=S.inbox.length?S.inbox.map(m=>`<div class="mail ${m.seen?'':'new'}"><button data-act="openMail" data-id="${m.id}"><b>${esc(m.subject)}</b><span class="muted small">To ${esc(m.to)} · ${esc(m.time)}</span></button>${S.ui.openMail===m.id?`<div class="mail-b"><p>${esc(m.body)}</p>${m.link?`<button class="btn sm primary" data-act="openLink" data-t="${m.link.token}">${m.link.type==='activate'?'Activate account':'Reset password'}</button><span class="muted small">Opening a link signs you out, like opening the email on another phone.</span>`:''}</div>`:''}</div>`).join(''):'<p class="muted small">No emails yet. Activation links, reset links and maintenance notices land here.</p>';
  root.innerHTML=fab+bar+`<div class="dback" data-act="drawer"></div><aside class="drawer" role="dialog" aria-label="Test tools">
  <div class="row" style="justify-content:space-between"><span class="row"><span class="tag">Test only</span><h3>Test tools</h3></span><button class="iconbtn" data-act="drawer" aria-label="Close test tools">${icon('x')}</button></div>
  <p class="muted small">This panel is not part of the app. It lets testers see emails and force error cases.</p>
  <section class="dsec"><h3>Inbox (${S.inbox.length})</h3>${mails}</section>
  <section class="dsec"><h3>Jump in as</h3><div class="row">${[['104233','Ahmad · Staff'],['200118','Rachel · Manager'],['300021','Kelvin · IT Admin']].map(x=>`<button class="btn sm" data-act="jump" data-uid="${x[0]}">${x[1]}</button>`).join('')}</div><span class="muted small">Skips the password and code. Use the real sign-in to test those.</span></section>
  <section class="dsec"><h3>Force a situation</h3>${sw('afterDeadline','Availability deadline has passed','Moves the staff clock to Thu 5 Nov, 00:01.')}${sw('emailFail','Email server is down','Activation, reset and maintenance emails fail.')}${sw('publishFail','Publishing fails','The manager sees a publish error.')}${sw('linkExpired','Email links have expired','Any link you open shows the expired page.')}</section>
  <section class="dsec"><h3>Actions</h3><div class="row"><button class="btn sm" data-act="timeout" ${S.session?'':'disabled'}>Session times out</button><button class="btn sm" data-act="autofill" ${S.roster.published?'disabled':''}>Fill all jobs (to test publish)</button><button class="btn sm danger" data-act="resetDemo">${S.ui.resetArm?'Click again to reset':'Reset all demo data'}</button></div></section>
  <section class="dsec"><h3>Scenarios (${SCN.length})</h3><p class="muted small">Every main flow and alternate flow, ready to show. Each one resets the demo data first.</p><button class="btn primary" data-act="scn" data-i="${S.ui.scn!=null?S.ui.scn:0}">${S.ui.scn!=null?'Back to presenting':'Present all scenarios from #1'}</button>
  ${[...new Set(SCN.map(x=>x.g))].map(g=>`<details class="scg" ${SCN.findIndex(x=>x.g===g)<=(S.ui.scn??-1)&&SCN.findLastIndex(x=>x.g===g)>=(S.ui.scn??-1)?'open':''}><summary>${g} <span class="muted small">(${SCN.filter(x=>x.g===g).length})</span></summary><div class="scl">${SCN.map((x,i)=>x.g===g?`<button class="scn-item ${S.ui.scn===i?'on':''}" data-act="scn" data-i="${i}"><span class="mono">${i+1}</span><span>${x.t}</span></button>`:'').join('')}</div></details>`).join('')}

/* ---------- actions ---------- */
function signIn(u){S.session={uid:u.id};S.view=defaultView(u.role);S.auth={screen:'login'};S.ui.pop=null;S.ui.compare=[];render();window.scrollTo(0,0);toast(`Signed in as ${esc(u.name)}.`)}
function fillAll(){let n=0;sortJobs(S.jobs).forEach(j=>{['captain','crew'].forEach(slot=>{if(j[slot])return;const pos=slot==='captain'?'Coach Captain':'Crew';const c=S.users.filter(u=>u.role==='staff'&&u.position===pos).filter(u=>eligibility(u,j,slot).ok).sort((a,b)=>workload(a)-workload(b))[0]||S.users.find(u=>u.role==='staff'&&u.status==='active'&&u.position===pos&&j.captain!==u.id&&j.crew!==u.id);if(c){j[slot]=c.id;n++}});if(!j.coach){const f=FLEET.find(r=>!coachBusy(r,j));if(f){j.coach=f;n++}}});return n}
function publishNow(){S.roster={published:true,at:stamp()};const counts={};S.jobs.forEach(j=>[j.captain,j.crew].forEach(id=>counts[id]=(counts[id]||0)+1));Object.entries(counts).forEach(([id,n])=>notify(id,`Roster for 16–22 Nov is published. You have ${n} job${n>1?'s':''}.`,'home'));return Object.keys(counts).length}
function curWeekAvail(){return getAvail(me().id,S.ui.week)}
const ACT={
  nav:el=>{if(el.dataset.v==='newuser')S.ui.created=null;go(el.dataset.v)},
  authGo:el=>{S.auth={screen:el.dataset.s};render()},
  togglePw:el=>{const i=el.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password';el.textContent=i.type==='password'?'Show':'Hide'},
  fill:el=>{$('#eid').value=el.dataset.id;$('#pw').value=PW;$('#pw').focus()},
  resendOtp:()=>toast('A new code was sent. (Test code is still '+OTP+'.)','info'),
  lockedReset:()=>{const uid=S.auth.uid;if(!S.resets.find(r=>r.uid===uid&&r.status!=='done')){S.resets.unshift({id:'R-'+(++S.seq.reset),uid,at:stamp(),status:'new'});notify('300021',`${user(uid).name} is locked out and asked for a password reset.`,'resets')}S.auth={screen:'forgotSent'};render()},
  badLinkReset:()=>{const uid=S.auth.uid;if(!S.resets.find(r=>r.uid===uid&&r.status==='new')){S.resets.unshift({id:'R-'+(++S.seq.reset),uid,at:stamp(),status:'new'});notify('300021',`${user(uid).name} asked for a new reset link.`,'resets')}S.auth={screen:'forgotSent'};render()},
  pop:el=>{S.ui.pop=S.ui.pop===el.dataset.p?null:el.dataset.p;render()},
  readAll:()=>{(S.notifs[me().id]||[]).forEach(n=>n.read=true);render()},
  openNotif:el=>{const n=(S.notifs[me().id]||[]).find(x=>x.id===+el.dataset.id);n.read=true;S.ui.pop=null;go(n.go||S.view)},
  signOut:()=>{S.session=null;S.auth={screen:'login',msg:'You signed out.'};S.ui.pop=null;render()},
  closeModal:()=>closeModal(),
  backdrop:(el,e)=>{if(e.target===el)closeModal()},
  /* staff */
  week:el=>{S.ui.week=el.dataset.m;S.ui.dayErr={};render()},
  addSlot:el=>openModal({type:'slot',day:el.dataset.day}),
  rmSlot:el=>{const a=curWeekAvail(),d=a.days[el.dataset.day],s=d.slots.splice(+el.dataset.i,1)[0];if(a.submitted)a.dirty=true;render();toast(`Removed ${s.s}–${s.e} on ${fmtD(el.dataset.day)}.`,'info')},
  saveDraft:()=>toast(`Draft saved. It is not sent until you press Submit (by ${fmtD(deadlineOf(S.ui.week))}, 23:59).`,'info'),
  submitAvail:()=>{
    const wk=S.ui.week,st=weekState(me().id,wk);
    if(st!=='open'&&st!=='submitted'){toast('The deadline has passed. This week is closed.','bad');render();return}
    const a=curWeekAvail(),ent=Object.entries(a.days),n=ent.reduce((t,[,d])=>t+d.slots.length,0);
    if(!n){toast('Add at least one time slot before you submit.','bad');return}
    const errs={};ent.forEach(([iso,d])=>{if(d.slots.length&&!d.loc)errs[iso]='Pick where you start this day.'});
    if(Object.keys(errs).length){S.ui.dayErr=errs;render();toast(`Pick a start location for ${joinAnd(Object.keys(errs).sort().map(fmtD))}.`,'bad');return}
    const re=a.submitted;a.submitted=true;a.dirty=false;a.submittedAt=stamp();S.ui.dayErr={};render();toast(`Availability for ${weekLabel(wk)} ${re?'resubmitted':'submitted'}. Your manager can now see it.`);

const FORMS={
  login:(f,fd)=>{
    const id=fd.get('eid').trim(),pw=fd.get('pw'),e={};
    if(!/^\d{6}$/.test(id))e.eid='Enter your 6-digit Employee ID.';if(!pw)e.pw='Enter your password.';
    if(hasErr(f,e))return;
    const u=user(id);
    if(u&&u.locked){S.auth={screen:'locked',uid:id};render();return}
    if(u&&u.status==='pending'){showErrors(f,{form:'This account is not activated yet. Use the activation link in your email to set a password.'});return}
    if(!u||u.password!==pw){
      if(u){u.fails=(u.fails||0)+1;if(u.fails>=5){u.locked=true;u.fails=0;notify('300021',`${u.name}'s account locked after 5 wrong passwords.`,'users');S.auth={screen:'locked',uid:id};render();return}save()}
      const left=u?5-u.fails:0;
      showErrors(f,{form:`Employee ID or password is wrong.${u?` ${left} ${left===1?'try':'tries'} left before the account locks.`:''}`});return;
    }
    if(u.status==='inactive'){showErrors(f,{form:'This account is inactive. Ask IT admin to activate it.'});return}
    u.fails=0;
    if(u.role!=='staff'){S.auth={screen:'twofa',uid:id,tries:0};render();return}
    signIn(u);
  },
  twofa:(f,fd)=>{const c=fd.get('code').trim();if(c!==OTP){S.auth.tries=(S.auth.tries||0)+1;if(S.auth.tries>=3){S.auth={screen:'login',tone:'warn',msg:'Too many wrong codes. Sign in again to get a new code.'};render();return}showErrors(f,{code:!/^\d{6}$/.test(c)?'Enter the 6-digit code.':`That code is wrong. ${3-S.auth.tries} ${3-S.auth.tries===1?'try':'tries'} left.`});return}signIn(user(S.auth.uid))},
  forgot:(f,fd)=>{const id=fd.get('eid').trim();if(!/^\d{6}$/.test(id)){showErrors(f,{eid:'Enter your 6-digit Employee ID.'});return}const u=user(id);if(u&&!S.resets.find(r=>r.uid===id&&r.status==='new')){S.resets.unshift({id:'R-'+(++S.seq.reset),uid:id,at:stamp(),status:'new'});notify('300021',`${u.name} asked for a password reset.`,'resets')}S.auth={screen:'forgotSent'};render()},
  setpw:(f,fd)=>{
    const pw=fd.get('pw'),pw2=fd.get('pw2'),e={};
    if(pw.length<12||!/[a-z]/i.test(pw)||!/\d/.test(pw))e.pw='Use at least 12 characters, with a letter and a number.';

    if(hasErr(f,e))return;
    const L=findLink(S.auth.token),u=user(L.uid);L.used=true;u.password=pw;u.locked=false;u.fails=0;
    if(L.type==='activate')u.status='active';else{const r=S.resets.find(x=>x.id===L.rid);if(r)r.status='done'}
    S.auth={screen:'login',tone:'ok',msg:L.type==='activate'?'Account activated. Sign in with your new password.':'Password saved. Sign in with your new password.',fill:u.id};render();
  },
  slot:(f,fd)=>{
    const day=fd.get('day'),s=fd.get('s'),e=fd.get('e');
    if(toMin(e)<=toMin(s)){showErrors(f,{e:'End time must be after the start time.'});return}
    const a=curWeekAvail(),d=a.days[day]||(a.days[day]={loc:'',slots:[]});
    const ov=d.slots.find(x=>toMin(s)<toMin(x.e)&&toMin(x.s)<toMin(e));
    if(ov){showErrors(f,{form:`This overlaps ${ov.s}–${ov.e} on ${fmtD(day)}. Change the times or remove the old slot.`});return}
    d.slots.push({s,e});d.slots.sort((x,y)=>toMin(x.s)-toMin(y.s));if(a.submitted)a.dirty=true;
    S.modal=null;render();toast(`Added ${s}–${e} on ${fmtD(day)}.${d.loc?'':' Pick a start location for that day.'}`);
  },

  cjob:(f,fd)=>{
    const o=fd.get('o'),d=fd.get('d'),date=fd.get('date'),dep=fd.get('dep'),e={};
    if(!o)e.o='Choose an origin.';if(!d)e.d='Choose a destination.';
    if(o&&d&&o===d)e.d='Destination must be different from origin.';
    else if(o&&d&&!routeOf(o,d))e.form=`${SHORT[o]} → ${SHORT[d]} is not a scheduled route. Every route runs between Singapore and one stop.`;
    if(!Object.keys(e).length){const t=timing({o,d,dep});if(t.end>1439)e.form=`This trip would end after midnight (${fmtDur(t.total)} long). Pick an earlier departure.`}
    if(hasErr(f,e))return;
    const id='JB-'+(++S.seq.job);S.jobs.push({id,date,dep,o,d,captain:null,crew:null,coach:null});S.ui.allocJob=id;S.ui.allocRole='captain';
    S.modal=null;render();toast(`${id} created for ${fmtD(date)}. Next, allocate staff.`);
  },
  coach:(f,fd)=>{
    const raw=fd.get('reg').toUpperCase().replace(/\s+/g,''),mt=raw.match(/^SKC(\d{4})([A-Z])$/),j=findJob(S.modal.id);
    if(!mt){showErrors(f,{reg:'Use the format SKC 1234 A.'});return}
    const reg=`SKC ${mt[1]} ${mt[2]}`;
    if(!FLEET.includes(reg)){showErrors(f,{reg:`${reg} is not in the fleet. Check the number on the coach.`});return}
    if(reg===j.coach){showErrors(f,{reg:`${reg} is already on this job.`});return}
    const b=coachBusy(reg,j);if(b){showErrors(f,{reg:`${reg} is on ${b.id} at that time (${b.dep}–${timing(b).arr}). Pick another coach.`});return}
    const prev=j.coach;j.coach=reg;S.modal=null;render();toast(prev?`${j.id}: coach changed from ${prev} to ${reg}.`:`${reg} assigned to ${j.id}.`);
  },
  decide:(f,fd)=>{
    const t=S.tickets.find(x=>x.id===fd.get('id')),dec=fd.get('dec'),reason=fd.get('reason').trim(),e={};
    if(!dec)e.dec='Choose approve, reject or close.';if(reason.length<5)e.reason='Add a reason. The staff member will see it.';
    if(hasErr(f,e))return;
    t.status=dec;t.decision={reason,at:stamp()};const u=user(t.uid),j=findJob(t.job);
    let extra='';
    if(dec==='approved'){if(j.captain===u.id)j.captain=null;if(j.crew===u.id)j.crew=null;extra=` ${esc(u.name)} is off ${j.id}. Find a replacement.`}
    notify(u.id,`Ticket ${t.id} for ${j.id} was ${dec}. Reason: ${reason}`,'tickets');
    render();toast(`Ticket ${t.id} ${dec}. ${esc(u.name)} was notified.${extra}`);
  },
  newuser:(f,fd)=>{
    const name=fd.get('name').trim(),email=fd.get('email').trim().toLowerCase(),eid=fd.get('eid').trim(),r=fd.get('role'),pos=fd.get('position'),e={};
    if(name.length<2)e.name='Enter the full name.';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))e.email='Enter a valid email, like name@coachco.sg.';
    else{const d=S.users.find(u=>u.email===email);if(d)e.email=`This email already belongs to ${esc(d.name)}.`}
    if(!/^\d{6}$/.test(eid))e.eid='Employee ID must be exactly 6 digits.';
    else{const d=user(eid);if(d)e.eid=`ID ${eid} is already used by ${esc(d.name)}. Try "Use next free ID".`}
    if(!r)e.role='Choose a role.';if(r==='staff'&&!pos)e.position='Choose Coach Captain or Crew.';
    if(hasErr(f,e))return;
    S.users.push({id:eid,name,role:r,position:r==='staff'?pos:r==='manager'?'Operations Manager':'IT Admin',status:'pending',lastWeek:0,workedNov:0,email,password:null,fails:0,locked:false});
    if(r==='staff')S.prefs[eid]={routes:[],shift:'any',off:[],notes:''};
    S.ui.created=eid;render();window.scrollTo(0,0);toast(`Account created for ${esc(name)}.`);
  },
  maint:(f,fd)=>{
    const v=fd.get('date'),msg=fd.get('msg').trim(),e={},n=NOW();
    if(!v)e.date='Pick a date.';
    else{const lead=dayDiff(n.date,v)*1440+120-toMin(n.time);
      if(lead<0)e.date='That date has already passed.';
      else if(dt(v).getUTCDay()!==2)e.date=`Maintenance can only run on a Tuesday. ${fmtD(v)} is a ${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dt(v).getUTCDay()]}.`;
      else if(lead<2880)e.date='Book at least 48 hours ahead so users get notice.';
      else if(S.maint.find(m=>m.date===v))e.date=`Maintenance is already booked for ${fmtD(v)}.`}
    if(msg.length<10)e.msg='Write a short message for users (at least 10 characters).';
    if(hasErr(f,e))return;
    openModal({type:'confirmMaint',date:v,msg});

function runScenario(i){
  if(i<0||i>=SCN.length)return;
  const sc=SCN[i];S=seed();sc.go();S.ui.scn=i;S.ui.drawer=false;render();window.scrollTo(0,0);
  if(sc.then)setTimeout(()=>{sc.then();S.ui.scn=i;renderTest()},40);
}

/* ---------- wiring ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(S.ui.pop&&!e.target.closest('.pop')&&!(el&&el.dataset.act==='pop')){S.ui.pop=null;if(!el){render();return}}
  if(!el)return;
  if(el.tagName==='A')e.preventDefault();
  if(el.disabled)return;
  const fn=ACT[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();FORMS[f.dataset.form](f,new FormData(f))});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&CHANGES[el.dataset.change])CHANGES[el.dataset.change](el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-input]');if(el&&INPUTS[el.dataset.input])INPUTS[el.dataset.input](el,e)});
document.addEventListener('keydown',e=>{if(S.ui.scn!=null&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&!e.target.closest('input,textarea,select')){const d=e.key==='ArrowRight'?1:-1,n=S.ui.scn+d;if(n>=0&&n<SCN.length)runScenario(n);return}if(e.key!=='Escape')return;if(S.modal){closeModal()}else if(S.ui.drawer){S.ui.drawer=false;renderTest()}else if(S.ui.pop){S.ui.pop=null;render()}});
render();
</script>
